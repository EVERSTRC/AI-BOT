<script>
// ============================================================================
// MOTOR DE INTELIGENCIA ARTIFICIAL PONDERADO
// ============================================================================
class UnifiedTradingAI {
    constructor() {
        this.weights = { smc: 0.40, vsa: 0.35, mtf: 0.25 };
        this.threshold = 65; // Umbral mínimo del 65% para validar trade
    }

    evaluateSMC(candles, index) {
        if (index < 20) return { score: 0, text: "Sin datos" };
        const current = candles[index];
        const lookback = candles.slice(index - 20, index);
        
        const maxHigh = Math.max(...lookback.map(c => c.high));
        const minLow = Math.min(...lookback.map(c => c.low));

        if (current.low < minLow && current.close > minLow) {
            return { score: 90, text: "SSL SWEEP (Compra)" };
        }
        if (current.high > maxHigh && current.close < maxHigh) {
            return { score: -90, text: "BSL SWEEP (Venta)" };
        }
        return { score: 0, text: "Zona Neutra" };
    }

    evaluateVSA(candles, index) {
        if (index < 21) return { score: 0, text: "Esperando..." };
        const current = candles[index];
        const lookback = candles.slice(index - 21, index);
        
        const avgVol = lookback.reduce((acc, c) => acc + c.volume, 0) / lookback.length;
        const isWhale = current.volume > (avgVol * 1.8);
        
        const range = current.high - current.low;
        if (range === 0) return { score: 0, text: "Rango Nulo" };

        const buyVol = current.volume * ((current.close - current.low) / range);
        const sellVol = current.volume - buyVol;
        const deltaPct = ((buyVol - sellVol) / current.volume) * 100;

        let score = deltaPct;
        if (isWhale) score *= 1.2;

        return { 
            score: Math.max(-100, Math.min(100, score)), 
            text: isWhale ? "VOLUMEN BALLENA" : "Volumen Normal",
            buyPct: ((buyVol / current.volume) * 100).toFixed(1),
            sellPct: ((sellVol / current.volume) * 100).toFixed(1)
        };
    }

    analyzeAtIndex(candles, index, isMacroNews, currentTF) {
        if (isMacroNews) {
            return { action: "NO_TRADE", confidence: 0, score: 0, reason: "⚠️ NOTICIA USD DE ALTO IMPACTO EN BREVE" };
        }

        const smc = this.evaluateSMC(candles, index);
        const vsa = this.evaluateVSA(candles, index);
        
        const mtfScore = (vsa.score > 0 && smc.score >= 0) ? 80 : (vsa.score < 0 && smc.score <= 0) ? -80 : 0;

        const compositeScore = (smc.score * this.weights.smc) + (vsa.score * this.weights.vsa) + (mtfScore * this.weights.mtf);
        const confidence = Math.abs(compositeScore).toFixed(1);

        let action = "HOLD";
        if (compositeScore >= this.threshold) action = "BUY";
        else if (compositeScore <= -this.threshold) action = "SELL";

        const currentPrice = candles[index].close;
        const multiplier = currentTF === "1m" ? 0.002 : 0.005;
        const buffer = currentPrice * multiplier;

        return {
            action,
            confidence,
            score: compositeScore.toFixed(1),
            tp: action === "BUY" ? (currentPrice + buffer * 2).toFixed(2) : (currentPrice - buffer * 2).toFixed(2),
            sl: action === "BUY" ? (currentPrice - buffer).toFixed(2) : (currentPrice + buffer).toFixed(2),
            smc,
            vsa
        };
    }
}

// ============================================================================
// INTEGRACIÓN CON INTERFAZ GRÁFICA Y WEBSOCKET
// ============================================================================
document.addEventListener("DOMContentLoaded", function () {
    const aiEngine = new UnifiedTradingAI();
    let currentCandleData = [];
    let chartMarkers = [];
    let ws = null;
    let isMacroNewsActive = false;

    const chartContainer = document.getElementById("chart");
    const statusEl = document.getElementById("status");
    const tfSelect = document.getElementById("timeframe");

    const chart = LightweightCharts.createChart(chartContainer, {
        width: chartContainer.clientWidth,
        height: chartContainer.clientHeight,
        layout: { background: { type: 'solid', color: '#0d1117' }, textColor: '#c9d1d9' },
        grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
        timeScale: { borderColor: '#30363d', timeVisible: true, secondsVisible: true }
    });

    const series = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350',
        borderUpColor: '#26a69a', borderDownColor: '#ef5350',
        wickUpColor: '#26a69a', wickDownColor: '#ef5350'
    });

    const resizeObserver = new ResizeObserver(entries => {
        if (!entries || entries.length === 0) return;
        const { width, height } = entries[0].contentRect;
        chart.applyOptions({ width, height });
    });
    resizeObserver.observe(chartContainer);

    // MÉTODOS PARA RECALCULAR EL HISTORIAL COMPLETO
    function buildHistoricalMarkers() {
        chartMarkers = [];
        const currentTF = tfSelect.value;

        for (let i = 21; i < currentCandleData.length; i++) {
            const decision = aiEngine.analyzeAtIndex(currentCandleData, i, isMacroNewsActive, currentTF);
            const candle = currentCandleData[i];

            if (decision.action === "BUY") {
                chartMarkers.push({
                    time: candle.time,
                    position: 'belowBar',
                    color: '#00e676',
                    shape: 'arrowUp',
                    text: `BUY (${decision.confidence}%)`
                });
            } else if (decision.action === "SELL") {
                chartMarkers.push({
                    time: candle.time,
                    position: 'aboveBar',
                    color: '#ff5252',
                    shape: 'arrowDown',
                    text: `SELL (${decision.confidence}%)`
                });
            }
        }
        series.setMarkers(chartMarkers);
    }

    async function fetchKlines(interval) {
        statusEl.innerText = "Cargando...";
        statusEl.style.color = "#ffb300";

        if (ws) ws.close();
        chartMarkers = [];
        series.setMarkers([]);

        try {
            const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${interval}&limit=500`);
            const data = await res.json();
            
            currentCandleData = data.map(d => ({
                time: Math.floor(d[0] / 1000),
                open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]), volume: parseFloat(d[5])
            }));

            series.setData(currentCandleData);
            
            // Generar marcas en el gráfico para todo el historial cargado
            buildHistoricalMarkers();
            
            connectWebSocket(interval);
            runAIAnalysis();
        } catch (err) {
            statusEl.innerText = "Error API";
            statusEl.style.color = "#ff1744";
        }
    }

    function connectWebSocket(interval) {
        ws = new WebSocket(`wss://stream.binance.com:9443/ws/btcusdt@kline_${interval}`);

        ws.onopen = () => {
            statusEl.innerText = "Conectado ✓";
            statusEl.style.color = "#00e676";
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            const k = msg.k;

            const candle = {
                time: Math.floor(k.t / 1000),
                open: parseFloat(k.o), high: parseFloat(k.h), low: parseFloat(k.l), close: parseFloat(k.c), volume: parseFloat(k.v)
            };

            series.update(candle);

            const lastIdx = currentCandleData.length - 1;
            if (lastIdx >= 0 && currentCandleData[lastIdx].time === candle.time) {
                currentCandleData[lastIdx] = candle;
            } else {
                currentCandleData.push(candle);
            }

            runAIAnalysis();
        };
    }

    function runAIAnalysis() {
        if (currentCandleData.length < 20) return;

        const currentTF = tfSelect.value;
        const lastIndex = currentCandleData.length - 1;
        const decision = aiEngine.analyzeAtIndex(currentCandleData, lastIndex, isMacroNewsActive, currentTF);

        const card = document.getElementById("ai-decision-card");
        const actionEl = document.getElementById("ai-action");
        const reasonEl = document.getElementById("ai-reason");
        const tpEl = document.getElementById("ai-tp");
        const slEl = document.getElementById("ai-sl");

        card.className = "";
        const lastCandle = currentCandleData[lastIndex];

        if (decision.action === "BUY") {
            card.classList.add("state-buy");
            actionEl.innerText = `🚀 COMPRA CONFIRMADA (${decision.confidence}%)`;
            reasonEl.innerText = `Barrido de Liquidez SMC + Absorción Compradora VSA.`;

            if (!chartMarkers.some(m => m.time === lastCandle.time)) {
                chartMarkers.push({
                    time: lastCandle.time,
                    position: 'belowBar',
                    color: '#00e676',
                    shape: 'arrowUp',
                    text: `BUY (${decision.confidence}%)`
                });
                series.setMarkers(chartMarkers);
            }

        } else if (decision.action === "SELL") {
            card.classList.add("state-sell");
            actionEl.innerText = `🐻 VENTA CONFIRMADA (${decision.confidence}%)`;
            reasonEl.innerText = `Distribución VSA + Barrido de MÁXIMOS SMC.`;

            if (!chartMarkers.some(m => m.time === lastCandle.time)) {
                chartMarkers.push({
                    time: lastCandle.time,
                    position: 'aboveBar',
                    color: '#ff5252',
                    shape: 'arrowDown',
                    text: `SELL (${decision.confidence}%)`
                });
                series.setMarkers(chartMarkers);
            }

        } else if (decision.action === "NO_TRADE") {
            actionEl.innerText = `⛔ NO OPERAR`;
            reasonEl.innerText = decision.reason;
        } else {
            card.classList.add("state-wait");
            actionEl.innerText = `⏳ ESPERANDO CONFLUENCIA (${decision.confidence}%)`;
            reasonEl.innerText = "Estructura en rango lateral. Aguardando acumulación/distribución.";
        }

        tpEl.innerText = `$${decision.tp}`;
        slEl.innerText = `$${decision.sl}`;

        document.getElementById("score-comp").innerText = `${decision.score}%`;
        document.getElementById("val-smc").innerText = decision.smc.text;
        document.getElementById("val-vsa").innerText = decision.vsa.text;

        const activeRow = document.getElementById(`row-${currentTF}`);
        if (activeRow) {
            activeRow.cells[1].innerText = decision.vsa.score > 0 ? "BUY" : "SELL";
            activeRow.cells[2].innerText = `${decision.vsa.buyPct}%`;
            activeRow.cells[3].innerText = `${decision.vsa.sellPct}%`;
        }
    }

    async function updateNews() {
        const newsEl = document.getElementById("news-container");
        try {
            const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent("https://www.mql5.com/es/rss/calendar")}`);
            const data = await res.json();
            if (data.items && data.items.length > 0) {
                const usdItem = data.items.find(i => i.title.includes("USD") || i.description.includes("USD"));
                if (usdItem) {
                    newsEl.innerText = `Próximo: ${usdItem.title.substring(0, 30)}...`;
                    return;
                }
            }
            newsEl.innerText = "Sin eventos USD clave hoy";
        } catch(e) {
            newsEl.innerText = "Feed noticias MQL5 activo";
        }
    }

    tfSelect.addEventListener("change", (e) => fetchKlines(e.target.value));

    fetchKlines("15m");
    updateNews();
});
</script>
